<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mi Comunidad</title>
    <link rel="icon" type="image/png" href="/cofifavicon.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5 mb-5">

     <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Mi Comunidad</h2>

      <div class="position-relative search-box">
        <i class="bi bi-search"></i>
        <input class="form-control" placeholder="Buscar publicaciones" id="postSearch">
      </div>
    </div>

    <!-- Crear publicación -->
    <button id="createPostBtn" class="btn btn-primary mb-4" style="padding: 12px 24px; font-size: 1.1rem;" onclick="toggleCreatePostForm()">
        + Crear post
    </button>

    <div id="createPostForm" class="card shadow-sm mb-5" style="display: none;">
        <div class="card-body">
            <form id="createPostFormElement">

                <div id="formErrors"></div>

                <input type="text"
                       id="postTitle"
                       name="title"
                       class="form-control mb-2"
                       placeholder="Título del post"
                       required>

                <input type="text"
                       id="postImageUrl"
                       name="imageUrl"
                       class="form-control mb-2"
                       placeholder="(OPCIONAL) URL de la imagen"
                       maxlength="100">

                <textarea id="postContent"
                          name="content"
                          class="form-control mb-3"
                          rows="3"
                          placeholder="¿Qué quieres compartir?"
                          required></textarea>

                <div class="mb-2">
                    <div class="d-flex gap-2 mb-2">
                        <input type="text"
                            id="tagInput"
                            class="form-control"
                            placeholder="Escribe un tag y pulsa Enter o Añadir"
                            maxlength="30">
                        <button type="button" class="btn btn-outline-primary" onclick="addTag()">
                            Añadir
                        </button>
                    </div>
                    <div id="tagsContainer" class="d-flex flex-wrap gap-2">
                        <!-- las cards de tags aparecen aquí -->
                    </div>
                    <small class="text-muted">Máximo 3 tags</small>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary" id="submitPostBtn">
                        Publicar
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="toggleCreatePostForm()">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <form method="get" action="/comunidad" class="mb-4">
        <input type="text" name="tag" placeholder="Buscar por tag"
            class="form-control">
    </form>

    <div th:if="${selectedTag != null}" class="alert alert-info">
        Mostrando publicaciones con tag:
        <strong th:text="${selectedTag}"></strong>

        <a href="/comunidad" class="ms-3">Quitar filtro</a>
    </div>

    <div class="card p-3 mb-4">
    <h5>Tags populares</h5>

    <div th:each="tag : ${popularTags}">
            <a th:href="@{/comunidad(tag=${tag[0]})}"
            class="badge bg-primary me-1">
                <span th:text="${tag[0]}"></span>
                (<span th:text="${tag[1]}"></span>)
            </a>
        </div>
    </div>

    <!-- GRID DE PUBLICACIONES -->
    <div class="row g-4">

        <div class="col-md-4" th:each="post : ${posts}">

            <div class="card h-100 shadow-sm post-card"
                 th:attr="data-title=${post.title},
                          data-content=${post.content},
                          data-author=${post.authorName},
                          data-id=${post.id},
                          data-tags=${post.tagNames != null ? #strings.arrayJoin(post.tagNames.toArray(), ',') : ''},
                          data-image=${post.pictureUrls != null && !post.pictureUrls.isEmpty() ? post.pictureUrls.get(0) : 'https://picsum.photos/400/250?random=' + post.id},
                          data-date=${#temporals.format(post.datePosted, 'dd/MM/yyyy HH:mm')}">

                <!-- Imagen del usuario o aleatoria por defecto -->
                <img th:src="${post.pictureUrls != null && !post.pictureUrls.isEmpty() ? post.pictureUrls.get(0) : 'https://picsum.photos/400/250?random=' + post.id}"
                     class="card-img-top"
                     alt="Imagen publicación">

                <div class="card-body d-flex flex-column">

                    <h5 class="card-title"
                        th:text="${post.title}"></h5>

                    <p class="card-text"
                       th:text="${#strings.length(post.content) > 240} 
                                ? ${#strings.substring(post.content,0,240)} + '...' 
                                : ${post.content}"></p>
                    
                    <div class="mt-auto">

                        <div class="reactions-container mt-2" th:attr="id='reactions-post-' + ${post.id}"></div>

                    </div>

                </div>

            </div>
        </div>

    </div>

</div>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Theme JS -->
<script th:src="@{/js/theme.js}"></script>
<script th:src="@{/js/comunidad.js}"></script>
<script th:src="@{/js/comentario.js}"></script>

<script>
function toggleCreatePostForm() {
    const form = document.getElementById('createPostForm');
    const btn = document.getElementById('createPostBtn');
    const isHidden = form.style.display === 'none';
    
    form.style.display = isHidden ? 'block' : 'none';
    btn.textContent = isHidden ? '✕ Cerrar formulario' : '+ Crear post';
}
</script>

<!-- Modal publicación -->
<div class="modal fade" id="postModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle"></h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <p class="text-muted mb-2">
                    Por <strong id="modalAuthor"></strong> —
                    <span id="modalDate"></span>
                </p>

                <img id="modalImage"
                     class="img-fluid mb-3"
                     alt="Imagen publicación">

                <p id="modalContent"></p>


                <div class="mt-2" id="modalTags"></div>

                <div class="mt-3">
                    <h6>Comentarios</h6>
                    <div id="commentsSection"></div>
                </div>

                <form id="commentForm">
                    <div class="mb-3">
                        <div class="post-group">
                            <input type="hidden" id="modalPostId">
                            <textarea id="commentContent" class="form-control mb-2"
                                    placeholder="Escribe un comentario..." required></textarea>

                        </div>
                        
                        <div class="button-group">
                            <button type="submit" class="btn btn-primary btn-sm">
                                Comentar
                            </button>
                        </div>
                    </div>
                </form>

            </div>

        </div>
    </div>
</div>
</body>
</html>
