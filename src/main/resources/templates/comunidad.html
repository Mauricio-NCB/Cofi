<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mi Comunidad</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5 mb-5">

     <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Mi Comunidad</h2>

      <div class="position-relative search-box">
        <i class="bi bi-search"></i>
        <input class="form-control" placeholder="Buscar publicaciones" id="postSearch">
      </div>
    </div>

    <!-- Crear publicación -->
    <div class="card shadow-sm mb-5">
        <div class="card-body">
            <form th:action="@{/comunidad/crear}" method="post">

                <div th:if="${param.error} == 'url'" class="alert alert-danger">
                    La URL de la imagen debe comenzar con <code>http://</code> o <code>https://</code>.
                </div>
                <div th:if="${param.error} == 'url_long'" class="alert alert-danger">
                    La URL de la imagen es demasiado larga (máx 100 caracteres).
                </div>

                <input type="text"
                       name="title"
                       class="form-control mb-2"
                       placeholder="Título del post"
                       required>

                <input type="text"
                       name="imageUrl"
                       class="form-control mb-2"
                       placeholder="(OPCIONAL) URL de la imagen"
                       maxlength="100">

                <textarea name="content"
                          class="form-control mb-3"
                          rows="3"
                          placeholder="¿Qué quieres compartir?"
                          required></textarea>

                <input type="text"
                       name="tags"
                       class="form-control mb-2"
                       placeholder="Tags (máx 3) separados por coma">

                <div class="text-end">
                    <button type="submit" class="btn btn-primary">
                        Publicar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <form method="get" action="/comunidad" class="mb-4">
        <input type="text" name="tag" placeholder="Buscar por tag"
            class="form-control">
    </form>

    <div th:if="${selectedTag != null}" class="alert alert-info">
        Mostrando publicaciones con tag:
        <strong th:text="${selectedTag}"></strong>

        <a href="/comunidad" class="ms-3">Quitar filtro</a>
    </div>

    <div class="card p-3 mb-4">
    <h5>Tags populares</h5>

    <div th:each="tag : ${popularTags}">
            <a th:href="@{/comunidad(tag=${tag[0]})}"
            class="badge bg-primary me-1">
                <span th:text="${tag[0]}"></span>
                (<span th:text="${tag[1]}"></span>)
            </a>
        </div>
    </div>

    <!-- GRID DE PUBLICACIONES -->
    <div class="row g-4">

        <div class="col-md-4" th:each="post : ${posts}">

            <div class="card h-100 shadow-sm post-card"
                 th:attr="data-title=${post.title},
                          data-content=${post.content},
                          data-author=${post.user.name},
                          data-id=${post.id},
                          data-image=${post.pictures != null && !post.pictures.isEmpty() ? post.pictures.get(0).url : 'https://picsum.photos/400/250?random=' + post.id},
                          data-date=${#temporals.format(post.datePosted, 'dd/MM/yyyy HH:mm')}">

                <!-- Imagen del usuario o aleatoria por defecto -->
                <img th:src="${post.pictures != null && !post.pictures.isEmpty() ? post.pictures.get(0).url : 'https://picsum.photos/400/250?random=' + post.id}"
                     class="card-img-top"
                     alt="Imagen publicación">

                <div class="card-body d-flex flex-column">

                    <h5 class="card-title"
                        th:text="${post.title}"></h5>

                    <p class="card-text"
                       th:text="${#strings.length(post.content) > 240} 
                                ? ${#strings.substring(post.content,0,240)} + '...' 
                                : ${post.content}"></p>
                    
                    <div class="mt-auto">

                        <div class="reactions-container mt-2" th:attr="id='reactions-post-' + ${post.id}"></div>

                    </div>

                </div>

            </div>
        </div>

    </div>

</div>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Theme JS -->
<script th:src="@{/js/theme.js}"></script>
<script th:src="@{/js/comunidad.js}"></script>
<script th:src="@{/js/comentario.js}"></script>

<!-- Modal publicación -->
<div class="modal fade" id="postModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle"></h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <p class="text-muted mb-2">
                    Por <strong id="modalAuthor"></strong> —
                    <span id="modalDate"></span>
                </p>

                <img id="modalImage"
                     class="img-fluid mb-3"
                     alt="Imagen publicación">

                <p id="modalContent"></p>

            </div>

            <div class="mt-2" th:if="${post != null && !#lists.isEmpty(post.tags)}">
                <a th:each="tag : ${post.tags}"
                   th:href="@{/comunidad(tag=${tag.name})}"
                   class="badge bg-secondary me-1"
                   th:text="${tag.name}">
                </a>
            </div>

            <div class="mt-3">
                <h6>Comentarios</h6>
                <div id="commentsSection"></div>
            </div>

            <form th:action="@{/comunidad/comentario}" method="post">

                <input type="hidden" name="postId" id="modalPostId">

                <textarea name="content"
                        class="form-control mb-2"
                        placeholder="Escribe un comentario..."
                        required></textarea>

                <button class="btn btn-primary btn-sm">
                Comentar
                </button>

            </form>

        </div>
    </div>
</div>
</body>
</html>
