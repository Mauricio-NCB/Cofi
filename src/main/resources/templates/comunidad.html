<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mi Comunidad</title>

    <!-- Aplicar tema antes de render -->
    <script>
        (function () {
            const theme = localStorage.getItem("theme");
            const fontSize = localStorage.getItem("fontSize");

            if (theme) {
                document.documentElement.setAttribute("data-theme", theme);
            }

            if (fontSize) {
                document.documentElement.setAttribute("data-font", fontSize);
            }
        })();
    </script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5 mb-5">

    <h2 class="text-center mb-4">Mi Comunidad</h2>

    <!-- Crear publicación -->
    <div class="card shadow-sm mb-5">
        <div class="card-body">
            <form th:action="@{/comunidad/crear}" method="post">
                <input type="text"
                       name="title"
                       class="form-control mb-2"
                       placeholder="Título del post"
                       required>

                <textarea name="content"
                          class="form-control mb-3"
                          rows="3"
                          placeholder="¿Qué quieres compartir?"
                          required></textarea>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary">
                        Publicar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- GRID DE PUBLICACIONES -->
    <div class="row g-4">

        <div class="col-md-4"
             th:each="post : ${posts}">

            <div class="card h-100 shadow-sm post-card"
                 data-bs-toggle="modal"
                 data-bs-target="#postModal"
                 th:attr="data-title=${post.title},
                          data-content=${post.content},
                          data-author=${post.user.name},
                          data-date=${#temporals.format(post.datePosted, 'dd/MM/yyyy HH:mm')}">

                <!-- Imagen aleatoria -->
                <img th:src="'https://picsum.photos/400/250?random=' + ${post.id}"
                     class="card-img-top"
                     alt="Imagen publicación">

                <div class="card-body d-flex flex-column">

                    <h5 class="card-title"
                        th:text="${post.title}"></h5>

                    <p class="card-text"
                       th:text="${#strings.length(post.content) > 240} 
                                ? ${#strings.substring(post.content,0,240)} + '...' 
                                : ${post.content}"></p>

                </div>

            </div>
        </div>

    </div>

</div>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Theme JS -->
<script th:src="@{/js/theme.js}"></script>
<script th:src="@{/js/comunidad.js}"></script>

<!-- Modal publicación -->
<div class="modal fade" id="postModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle"></h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <p class="text-muted mb-2">
                    Por <strong id="modalAuthor"></strong> —
                    <span id="modalDate"></span>
                </p>

                <img id="modalImage"
                     class="img-fluid mb-3"
                     alt="Imagen publicación">

                <p id="modalContent"></p>

            </div>

        </div>
    </div>
</div>

</body>
</html>
