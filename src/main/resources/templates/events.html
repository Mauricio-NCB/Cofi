<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Eventos</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- App styles -->
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

  <!-- NAVBAR (fragment) -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Hola, <span th:text="${userName}">Usuario</span></h2>

      <div class="position-relative search-box">
        <i class="bi bi-search"></i>
        <input class="form-control" placeholder="Buscar" id="eventSearch">
      </div>
    </div>

    <p>
      Encuentra eventos según tu código postal:
      <select class="form-select d-inline w-auto ms-2" style="background-color:var(--color-accent); color:white;">
        <option>28001</option>
        <!-- HABRA QUE CAMBIARLO PARA QUE SEA DINÁMICO -->
        <option>28002</option>
      </select>
    </p>

    <!-- EVENTOS -->
    <div class="activities-section mt-4">
      <h3>Eventos cerca de ti</h3>

      <div class="row mt-3" th:if="${#lists.isEmpty(events)}">
        <div class="col-12">
          <div class="alert alert-info">No hay eventos disponibles.</div>
        </div>
      </div>

      <!-- CONTENEDOR DE SCROLL -->
      <div class="scroll-outer mt-3" th:if="${!#lists.isEmpty(events)}">
      <div class="d-flex flex-nowrap overflow-auto" style="width: 100%;">
        <div class="flex-shrink-0 me-3" style="width: 400px;" th:each="ev : ${events}">
          <div class="card event-card h-100"
                data-bs-toggle="modal"
                data-bs-target="#viewEventModal"
                th:attr="data-title=${ev.title},
                          data-desc=${ev.description},
                          data-start=${ev.startDate},
                          data-end=${ev.endDate},
                          data-capacity=${ev.maxCapacity}">

            <img src="https://picsum.photos/id/1015/600/300"
             class="card-img-top"
             alt="Imagen del evento">

            <div class="card-body d-flex flex-column">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="card-title" th:text="${ev.title}">Título</h5>
                <span class="badge"
                      th:classappend="${ev.state == 'en_curso' ? ' bg-success' :
                                      (ev.state == 'terminado' ? ' bg-secondary' :
                                      (ev.state == 'cancelado' ? ' bg-danger' :
                                      ' bg-warning'))}"
                      th:text="${ev.state == 'en_curso' ? 'En curso' :
                                (ev.state == 'terminado' ? 'Terminado' :
                                (ev.state == 'cancelado' ? 'Cancelado' :
                                'Próximo'))}">
                </span>

              </div>

              <!-- Contenedor de descripción -->
              <div class="description-container mb-2">
                <p class="card-text text-muted mb-0" th:text="${ev.description}">
                  Descripción completa
                </p>
              </div>
              <button class="btn btn-link p-0 mt-auto view-more-btn" style="display:none;">Ver más</button>

              <p class="mb-1 mt-2">
                <strong>Fechas:</strong>
                <span th:text="${ev.startDate}"></span> — <span th:text="${ev.endDate}"></span>
              </p>

              <p class="mb-0">
                <strong>Aforo:</strong> <span th:text="${ev.maxCapacity}"></span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <!-- BOTÓN CREAR EVENTO -->
  <button class="fixed-create-btn" data-bs-toggle="modal" data-bs-target="#createEventModal">
    + Crear evento
  </button>

  <!-- MODAL VER EVENTO -->
  <div class="modal fade" id="viewEventModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="modalEventTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <p id="modalEventDesc"></p>

          <p><strong>Fechas:</strong>
            <span id="modalStart"></span> —
            <span id="modalEnd"></span>
          </p>

          <p><strong>Aforo:</strong>
            <span id="modalCapacity"></span>
          </p>
        </div>

      </div>
    </div>
  </div>


  <!-- MODAL CREAR EVENTO -->
  <div class="modal fade" id="createEventModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Crear nuevo evento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form th:action="@{/eventos/crear}" method="post" th:object="${event}">
              <div class="mb-3">
                <label class="form-label">Título</label>
                <input type="text" th:field="*{title}" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
              </div>

              <div class="row">
                <div class="col">
                  <label class="form-label">Fecha inicio</label>
                  <input type="date" th:field="*{startDate}" class="form-control" required>
                </div>
                <div class="col">
                  <label class="form-label">Fecha fin</label>
                  <input type="date" th:field="*{endDate}" class="form-control" required>
                </div>
              </div>

              <div class="mb-3 mt-3">
                <label class="form-label">Aforo</label>
                <input type="number" th:field="*{maxCapacity}" class="form-control" min="1" required>
              </div>

              <button type="submit" class="btn btn-primary">Crear evento</button>
          </form>

        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS & dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/events.js}"></script>
  
</body>
</html>
