<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title> <link rel="icon" type="image/png" href="/images/cofifavicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card p-4 shadow" style="width: 400px">
        <h4 class="mb-4 text-center">Iniciar sesión</h4>
        <div id="loginError" class="alert alert-danger d-none"></div>
        <input type="text" id="name" class="form-control mb-3" placeholder="Nombre" onkeypress="handleLoginKeypress(event)">
        <input type="text" id="lastname" class="form-control mb-3" placeholder="Apellido" onkeypress="handleLoginKeypress(event)">
        <input type="password" id="password" class="form-control mb-3" placeholder="Contraseña" onkeypress="handleLoginKeypress(event)">
        <button class="btn btn-primary w-100" onclick="login()">Entrar</button>
        <p class="text-center mt-3">¿No tienes cuenta? <a th:href="@{/auth/register}">Regístrate</a></p>
    </div>

    <script>
        function handleLoginKeypress(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                login();
            }
        }

        async function login() {
            const name = document.getElementById("name").value.trim();
            const lastname = document.getElementById("lastname").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorDiv = document.getElementById("loginError");

            // Validar campos obligatorios
            if (!name) {
                errorDiv.classList.remove("d-none");
                errorDiv.textContent = "Se requiere nombre";
                return;
            }

            if (!lastname) {
                errorDiv.classList.remove("d-none");
                errorDiv.textContent = "Se requiere apellido";
                return;
            }

            if (!password) {
                errorDiv.classList.remove("d-none");
                errorDiv.textContent = "Se requiere contraseña";
                return;
            }

            // Verificar si el usuario existe
            const userExists = await fetch(`/auth/check-user`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: name,
                    lastName: lastname
                })
            }).then(res => res.json())
              .catch(err => {
                  console.error('Error checking user:', err);
                  return false;
            });

            if (!userExists) {
                errorDiv.classList.remove("d-none");
                errorDiv.textContent = "Usuario no existe";
                return;
            }

            // Intentar login
            const res = await fetch("/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: name,
                    lastname: lastname,
                    password: password
                })
            });

            if (res.ok) {
                const data = await res.json();

                localStorage.setItem("accessToken", data.accessToken);
                localStorage.setItem("refreshToken", data.refreshToken);
                localStorage.setItem("user", JSON.stringify(data.user));

                document.cookie = `accessToken=${data.accessToken}; path=/; SameSite=Strict`;
                
                window.location.href = "/";
  
            } else {
                errorDiv.classList.remove("d-none");
                errorDiv.textContent = "Contraseña incorrecta";
            }
        }
    </script>
</body>
</html>
