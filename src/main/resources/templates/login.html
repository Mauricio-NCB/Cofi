<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title> <link rel="icon" type="image/png" href="cofifavicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card p-4 shadow" style="width: 400px">
        <h4 class="mb-4 text-center">Iniciar sesión</h4>
        <div id="loginError" class="alert alert-danger d-none"></div>
        <input type="text" id="name" class="form-control mb-3" placeholder="Nombre">
        <input type="text" id="lastname" class="form-control mb-3" placeholder="Apellido">
        <input type="password" id="password" class="form-control mb-3" placeholder="Contraseña">
        <button class="btn btn-primary w-100" onclick="login()">Entrar</button>
        <p class="text-center mt-3">¿No tienes cuenta? <a th:href="@{/auth/register}">Regístrate</a></p>
    </div>

    <script>
        async function login() {
            const res = await fetch("/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: document.getElementById("name").value,
                    lastname: document.getElementById("lastname").value,
                    password: document.getElementById("password").value
                })
            });
            if (res.ok) {
                const data = await res.json();

                localStorage.setItem("accessToken", data.accessToken);
                localStorage.setItem("refreshToken", data.refreshToken);
                localStorage.setItem("user", JSON.stringify(data.user));

                document.cookie = `accessToken=${data.accessToken}; path=/; SameSite=Strict`;
                
                window.location.href = "/";
  
            } else {
                document.getElementById("loginError").classList.remove("d-none");
                document.getElementById("loginError").textContent = "Nombre, apellido o contraseña incorrectos";
            }
        }
    </script>
</body>
</html>
