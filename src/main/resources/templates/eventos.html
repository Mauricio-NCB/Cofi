<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Eventos</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- App styles -->
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

  <!-- NAVBAR (fragment) -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Hola, <span th:text="${userName}">Usuario</span></h2>

      <div class="position-relative search-box">
        <i class="bi bi-search"></i>
        <input class="form-control" placeholder="Buscar">
      </div>
    </div>

    <p>
      Encuentra eventos según tu código postal:
      <select class="form-select d-inline w-auto ms-2" style="background-color:var(--color-accent); color:white;">
        <option>28001</option>
        <!-- HABRA QUE CAMBIARLO PARA QUE SEA DINÁMICO -->
        <option>28002</option>
      </select>
    </p>

    <!-- EVENTOS -->
    <div class="activities-section mt-4">
      <h3>Eventos cerca de ti</h3>

      <div class="row mt-3" th:if="${#lists.isEmpty(events)}">
        <div class="col-12">
          <div class="alert alert-info">No hay eventos disponibles.</div>
        </div>
      </div>

      <!-- CONTENEDOR DE SCROLL -->
      <div class="scroll-outer mt-3" th:if="${!#lists.isEmpty(events)}">
      <div class="d-flex flex-nowrap overflow-auto" style="width: 100%;">
        <div class="flex-shrink-0 me-3" style="width: 400px;" th:each="ev : ${events}">
          <div class="card event-card h-100">
            <div class="card-body d-flex flex-column">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="card-title" th:text="${ev.title}">Título</h5>
                <span class="badge"
                      th:classappend="${ev.state == 'ongoing' ? ' bg-success' :
                                      (ev.state == 'finished' ? ' bg-secondary' : ' bg-danger')}"
                      th:text="${ev.state}">estado</span>
              </div>

              <!-- Contenedor de descripción -->
              <div class="description-container mb-2">
                <p class="card-text text-muted mb-0" th:text="${ev.description}">
                  Descripción completa
                </p>
              </div>
              <button class="btn btn-link p-0 mt-auto view-more-btn" style="display:none;">Ver más</button>

              <p class="mb-1 mt-2">
                <strong>Fechas:</strong>
                <span th:text="${ev.startDate}"></span> — <span th:text="${ev.endDate}"></span>
              </p>

              <p class="mb-0">
                <strong>Aforo:</strong> <span th:text="${ev.maxCapacity}"></span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <!-- BOTÓN CREAR EVENTO -->
  <button class="fixed-create-btn" onclick="location.href='crear-evento.html'">
    + Crear evento
  </button>

  <!-- Bootstrap JS & dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.event-card');

      cards.forEach(card => {
        const descContainer = card.querySelector('.description-container');
        const btn = card.querySelector('.view-more-btn');

        // Comparamos altura real con altura visible
        if (descContainer.scrollHeight > descContainer.clientHeight) {
          btn.style.display = 'block'; // mostrar botón solo si es necesario
          btn.addEventListener('click', () => {
            descContainer.classList.toggle('expanded');
            btn.textContent = descContainer.classList.contains('expanded') ? 'Ver menos' : 'Ver más';
          });
        }
      });
    });
  </script>
  
</body>
</html>
