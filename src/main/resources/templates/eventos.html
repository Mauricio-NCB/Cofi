<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Eventos</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- App styles -->
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

  <!-- NAVBAR (fragment) -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Hola, <span th:text="${userName}">Usuario</span></h2>

      <div class="position-relative search-box">
        <i class="bi bi-search"></i>
        <input class="form-control" placeholder="Buscar">
      </div>
    </div>

    <p>
      Encuentra actividades según tu código postal:
      <select class="form-select d-inline w-auto ms-2" style="background-color:var(--color-accent); color:white;">
        <option>28001</option>
        <!-- HABRA QUE CAMBIARLO PARA QUE SEA DINÁMICO -->
        <option>28002</option>
      </select>
    </p>

    <!-- ACTIVIDADES -->
    <div class="activities-section mt-4">
      <h3>Actividades cerca de ti</h3>

      <div class="row mt-3">
        <div class="col-md-3" th:each="act : ${activities}">
          <div class="card">
            <img th:src="${act.imageUrl}" th:alt="${act.title}" class="card-img-top" />
            <div class="card-body">
              <span class="activity-tag bg-success text-white" th:text="${act.tag}">Tag</span>
              <h5 class="mt-2" th:text="${act.title}">Título</h5>
              <p class="text-muted" th:text="${act.author}">Por Autor</p>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <!-- BOTÓN CREAR ACTIVIDAD -->
  <button class="fixed-create-btn" onclick="location.href='crear-actividad.html'">
    + Crear actividad
  </button>

  <!-- Bootstrap JS & dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
