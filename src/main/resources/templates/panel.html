<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel principal</title> <link rel="icon" type="image/png" href="cofifavicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head> 
<body>
    
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <h2>Bienvenido a tu perfil, <span id="userName"></span></h2>

    <!-- INFORMACIÓN PERSONAL -->
    <div class="card shadow-sm p-4 mt-4">
        <h5 class="mb-3"><i class="bi bi-person-circle me-2"></i>Información personal</h5>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Nombre</label>
                <p id="userNameDisplay" class="form-control-plaintext border rounded px-3 py-2"></p>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Apellido</label>
                <p id="userLastnameDisplay" class="form-control-plaintext border rounded px-3 py-2"></p>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Código postal</label>
                <p id="userPostcodeDisplay" class="form-control-plaintext border rounded px-3 py-2"></p>
            </div>
        </div>
    </div>

    <!-- CATEGORÍAS DE INTERÉS -->
    <div class="card shadow-sm p-4 mt-4">
        <h5 class="mb-3"><i class="bi bi-tags me-2"></i>Categorías de interés</h5>
        <p class="text-muted">Selecciona las categorías que te interesan para recibir recomendaciones de eventos.</p>
        <div id="categoriesContainer" class="d-flex flex-wrap gap-2 mb-3"></div>
        <button class="btn btn-primary mt-2" onclick="saveCategories()">
            Guardar preferencias
        </button>
        <div id="categoriesSuccess" class="alert alert-success mt-3 d-none">
            Preferencias guardadas correctamente
        </div>
    </div>

    <!-- PERSONALIZACIÓN DE DISEÑO -->
    <div class="card shadow-sm p-4 mt-4">
        <h5 class="mb-3"><i class="bi bi-palette me-2"></i>Personalizar diseño</h5>

        <p class="fw-bold mb-2">Color del tema:</p>
        <div class="d-flex gap-2 mb-3">
            <button onclick="changeTheme('')" class="btn btn-sm btn-secondary">Marrón</button>
            <button onclick="changeTheme('azul')" class="btn btn-sm btn-primary">Azul</button>
            <button onclick="changeTheme('verde')" class="btn btn-sm btn-success">Verde</button>
            <button onclick="changeTheme('morado')" class="btn btn-sm btn-purple">Morado</button>
        </div>

        <p class="fw-bold mb-2">Tamaño de letra:</p>
        <div class="d-flex gap-2">
            <button onclick="changeFontSize('small')" class="btn btn-sm btn-outline-dark">Pequeña</button>
            <button onclick="changeFontSize('normal')" class="btn btn-sm btn-outline-dark">Normal</button>
            <button onclick="changeFontSize('large')" class="btn btn-sm btn-outline-dark">Grande</button>
        </div>
    </div>

</div>


<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/theme.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script>
    const selectedCategories = new Set();

    // cargar datos del usuario desde localStorage
    if (userStr) {
        const user = JSON.parse(userStr);
        document.getElementById("userNameDisplay").textContent = user.name || "";
        document.getElementById("userLastnameDisplay").textContent = user.lastname || "";
        document.getElementById("userPostcodeDisplay").textContent = user.postcode || "No especificado";
    }

    // cargar categorías y marcar las ya seleccionadas
    async function loadCategories() {
        const [catsRes, prefsRes] = await Promise.all([
            fetch("/api/categories"),
            fetch("/api/categories/user")
        ]);

        const categories = await catsRes.json();
        const prefs = prefsRes.ok ? await prefsRes.json() : [];
        const prefNames = prefs.map(p => p.name);

        const container = document.getElementById("categoriesContainer");
        container.innerHTML = "";

        categories.forEach(cat => {
            const card = document.createElement("div");
            card.className = "category-card";
            card.textContent = cat.name;
            card.dataset.id = cat.id;

            if (prefNames.includes(cat.name)) {
                card.classList.add("selected");
                selectedCategories.add(cat.name);
            }

            card.addEventListener("click", () => {
                if (selectedCategories.has(cat.name)) {
                    selectedCategories.delete(cat.name);
                    card.classList.remove("selected");
                } else {
                    selectedCategories.add(cat.name);
                    card.classList.add("selected");
                }
            });

            container.appendChild(card);
        });
    }

    async function saveCategories() {
        const res = fetch("/auth/update-categories", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Array.from(selectedCategories))
        })

        if (res.ok) {
            const successDiv = document.getElementById("categoriesSuccess");
            successDiv.classList.remove("d-none");
            setTimeout(() => successDiv.classList.add("d-none"), 3000);
        }
    }

    loadCategories();    
</script>


</body>
</html>
