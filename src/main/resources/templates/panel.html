<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head> 
<body>
    
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <h2>Bienvenido, <span id="userName"></span></h2>

    <div class="row g-4 mt-3">  

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <i class="bi bi-calendar-event fs-1"></i>
                    <h5 class="mt-3">Eventos</h5>
                    <p>Consulta y crea eventos de tu comunidad</p>
                    <a href="/eventos" class="btn btn-primary">Ver eventos</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <i class="bi bi-people fs-1"></i>
                    <h5 class="mt-3">Comunidad</h5>
                    <p>Publicaciones y conversaciones</p>
                    <a href="/comunidad" class="btn btn-primary">Ver comunidad</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <i class="bi bi-chat-dots fs-1"></i>
                    <h5 class="mt-3">Chat</h5>
                    <p>Mensajes con otros usuarios</p>
                    <a href="/chat" class="btn btn-primary">Ver chats</a>
                </div>
            </div>
        </div>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
