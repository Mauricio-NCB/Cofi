<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Calendario</title> 
    <link rel="icon" type="image/png" href="/images/cofifavicon.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <!-- Estilos propios -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h2 class="text-center mb-4">Mi Calendario de Actividades</h2>
    <div id="calendar"></div>
</div>

<div class="modal fade" id="viewEventModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalEventTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="row">

          <!-- Columna de información del evento -->

          <div class="col-md-5 border-end">
            <p id="modalEventDesc" class="text-muted"></p>

            <p><strong>Fecha: </strong> <span id="modalDate"></span></p>
            <p><strong>Hora: </strong> <span id="modalTime"></span></p>
            <p><strong>Plazas Disponibles: </strong> <span id="modalCapacity"></span></p>

            <hr>

            <h6><i class="bi bi-people me-1"></i> Participantes</h6>
            <ul id="modalParticipants" class="list-group list-group-flush">
              <!-- Aquí se cargarán los participantes -->
            </ul>
          </div>


          <!-- Columna de chat de evento -->
          <div class="col-md-7 d-flex flex-column">

            <h6><i class="bi bi-chat me-1"></i> Chat del evento</h6>

            <div id="eventChatMessages" class="flex-grow-1 border rounded p-2 mb-3 overflow-auto" style="max-height: 350px;">
              <!-- Aquí se cargarán los mensajes del chat del evento -->
            </div>

            <form id="eventMessageForm">
              <div class="input-group">
                <input type="text" id="eventMessageInput" class="form-control" placeholder="Escribe tu mensaje..." required>
                <button type="submit" class="btn btn-primary">Enviar
                  <i class="bi bi-send ms-1"></i>
                </button>
              </div>
            </form>

          </div>

        </div>

      </div>

    </div>
  </div>
</div>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JS & dependencies -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/calendario.js}"></script>
<script th:src="@{/js/theme.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script>
  checkAndRefreshToken(true)
</script>

</body>
</html>
