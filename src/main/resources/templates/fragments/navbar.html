<!-- navbar fragment -->
<div th:fragment="navbar">
  <nav class="navbar navbar-expand-lg" style="min-height: 60px; align-items: center;">
    <div class="container-fluid">
      <a class="navbar-brand" href="/" style="margin-right: 30px; padding: 0;">
        <img src="/images/cofi.png" alt="Mi Sitio" style="height: 40px; max-width: 200px; object-fit: contain;">
      </a>

      <!-- Botones de navegación -->
      <ul class="navbar-nav ms-4">
        <li class="nav-item">
            <a class="nav-link"
              th:href="@{/}"
              th:classappend="${currentPage == 'home'} ? 'active'">
              Inicio
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link"
              th:href="@{/eventos}"
              th:classappend="${currentPage == 'eventos'} ? 'active'">
              Eventos
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link"
              th:href="@{/comunidad}"
              th:classappend="${currentPage == 'comunidad'} ? 'active'">
              Comunidad
            </a>
        </li>
        
        <li class="nav-item">
          <a class="nav-link"
            th:href="@{/about}"
            th:classappend="${currentPage == 'about'} ? 'active'">
            Sobre nosotros
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link"
            th:href="@{/actividades-madrid}"
            th:classappend="${currentPage == 'actividades-madrid'} ? 'active'">
            Actividades Madrid
          </a>
        </li>

      </ul>

      <script th:src="@{/js/theme.js}"></script>

      <!-- Botones de autenticación -->
      <div class="ms-auto" id="navGuest">
        <a th:href="@{/auth/login}" class="btn btn-outline-primary me-2">Iniciar sesión</a>
        <a th:href="@{/auth/register}" class="btn btn-primary">Registrarse</a>
      </div>

      <!-- Botones si hay usuario logueado -->
      <div class="ms-auto d-none" id="navUser">

        <span class="me-3" id="navUserName"></span>
        
        <i class="bi bi-calendar3 mx-2" id="calendarBtn"
            style="cursor:pointer" title="Calendario"></i>

        <i class="bi bi-chat mx-2" id="messagesBtn"
            style="cursor:pointer" title="Mensajes"></i>

        <i class="bi bi-person mx-2" id = "userPanelBtn"
            style="cursor:pointer" title="Panel de usuario"></i>
        
        <i class="bi bi-box-arrow-right mx-2" id="logoutBtn" 
           style="cursor:pointer" title="Cerrar sesión"></i>
      </div>

      <script>
        (function() {
            const token = localStorage.getItem("accessToken");
            const userStr = localStorage.getItem("user");

            if (token && userStr) {
                const user = JSON.parse(userStr);

                // mostrar links de navegación
                //document.getElementById("navLinks").style.display = "flex";

                // mostrar zona de usuario, ocultar zona de invitado
                document.getElementById("navGuest").classList.add("d-none");
                document.getElementById("navUser").classList.remove("d-none");

                // mostrar nombre del usuario
                document.getElementById("navUserName").textContent = 
                    user.name + " " + user.lastname;

                // calendario
                document.getElementById("calendarBtn").addEventListener("click", () => {
                    window.location.href = "/eventos/calendario";
                });

                // mensajes
                document.getElementById("messagesBtn").addEventListener("click", () => {
                    window.location.href = "/chat";
                });

                // panel de usuario
                document.getElementById("userPanelBtn").addEventListener("click", () => {
                    window.location.href = "/panel";
                });

                // logout
                document.getElementById("logoutBtn").addEventListener("click", async () => {
                    const refreshToken = localStorage.getItem("refreshToken");
                    await fetch(`/auth/logout?refreshToken=${refreshToken}`, { 
                        method: "POST",
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    localStorage.clear();
                    document.cookie = "accessToken=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
                    window.location.href = "/inicio";
                });

            } else {
                // no logueado, redirigir si la página lo requiere
                const publicPaths = ["/", "/inicio",
                                    "/eventos",
                                    "/comunidad",
                                    "/auth/login", "/auth/register", 
                                    "api/categories",
                                    "/about", "/terminos"];
                const isPublic = publicPaths.some(p => window.location.pathname.startsWith(p));

                if (!isPublic) {
                    window.location.href = "/inicio";
                }
            }
        })();
      </script>
    </div>
  </nav>
</div>
