<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Chats disponibles</title> <link rel="icon" type="image/png" href="/images/cofifavicon.png">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- App styles -->
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>

<body>

  <!-- NAVBAR (fragment) -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>    

  <!-- Lista de chats -->

  <div class="container mt-5 mb-5">
    <h2 class="mb-4">Mis Chats</h2>

    <!-- SECCIÓN: Chats del usuario -->
    <div th:if="${chats.?[eventId == null].size() > 0}">
      <div class="card shadow-sm p-4 mb-4">
        
        <div class="row g-3">
          <div class="col-md-6" th:each="chat : ${chats}" th:if="${chat.eventId == null}">
            <div class="card h-100 chat-card border-0 shadow-sm" 
                 style="cursor: pointer; transition: transform 0.2s ease;"
                 th:attr="data-id=${chat.id},
                          data-name=${chat.name}">

              <div class="card-body d-flex justify-content-between align-items-center">
                <div class="flex-grow-1">
                  <h6 class="card-title mb-0 fw-bold" th:text="${chat.name}"></h6>
                  <small class="text-muted">Pulsa para abrir</small>
                </div>

                <!-- Botón para eliminar -->
                <button class="btn btn-danger btn-sm" 
                        th:onclick="|deleteChat(${chat.id}, event)|"
                        onclick="event.stopPropagation()">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Botón para crear un nuevo chat -->
    <div class="d-flex justify-content-center mt-5">
      <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#createChatModal">
        <i class="bi bi-plus-circle me-2"></i>Crear nuevo chat
      </button>
    </div>

  </div>

  <!-- JS para manejar la apertura del modal y cargar los mensajes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/chat.js"></script>
  <script th:src="@{/js/auth.js}"></script>
  <script>
    checkAndRefreshToken(true)
  </script>

  <!-- Modal de chat -->
  <div class="modal fade" id="chatModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content" style="height: 600px; display: flex; flex-direction: column;">
                
        <div class="modal-header">

          <h5 
            class="modal-title" id="chatModalLabel"></h5>
          
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body d-flex flex-column" style="flex: 1; overflow: hidden;">
          
          <!-- Aquí se cargarán los mensajes del chat -->
          <div id="chatMessages" class="flex-grow-1 border rounded p-2 mb-3 overflow-auto">
            <!-- Mensajes del chat -->
          </div>

          <!-- Formulario para enviar un nuevo mensaje -->
          <form id="messageForm">
            <div class="input-group">
              <input type="text" id="messageInput" class="form-control" placeholder="Escribe tu mensaje..." required>
              <button type="submit" class="btn btn-primary">Enviar</button>
            </div>
          </form>
        
        </div>

      </div>
    </div>
  </div>

  <!-- Modal para crear un nuevo chat -->
  <div class="modal fade" id="createChatModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Crear Chat</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <!-- Formulario para crear un nuevo chat -->
          <div id="participantsList">
              <div class="participant-row d-flex mb-2">
                  <input type="text" class="form-control me-2 participant-name" placeholder="Nombre">
                  <input type="text" class="form-control participant-lastname" placeholder="Apellido">
              </div>
          </div>

          <button type="button" class="btn btn-secondary mb-2" onclick="addParticipant()">
              + Añadir participante
          </button>

          <input type="text" class="form-control mb-2" id="chatName" placeholder="Nombre del chat" required>

          <button type="button" class="btn btn-primary" onclick="createChat()">
              Crear chat
          </button>
        </div>
      
      </div>
    </div>
  </div>
</body>
</html>
