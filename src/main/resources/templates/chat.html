<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Chats disponibles</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- App styles -->
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>

<body>

  <!-- NAVBAR (fragment) -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>    

  <!-- Lista de chats -->

  <div class="container mt-4">
    <h1 class="mb-4">Chats disponibles</h1>

    <div class="list-chat-group" 
      th:each="chat : ${chats}">

      <div class="card h-100 mb-3 chat-card"
          data-bs-toggle="modal"
          data-bs-target="#chatModal"
          th:attr="data-id=${chat.id}">

          <div class="chat-card-body d-flex align-items-center">

            <h5 class="chat-id"
              th:text="'Chat Nº ' + ${chat.id}"></h5>

            <!-- Botón para eliminar -->
            <form th:action="@{'/chat/' + ${chat.id} + '/delete'}" method="post" style="display: inline;">
              <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro de eliminar este chat?')">Eliminar</button>
            </form>

          </div>
      </div>

    </div>

    <!-- Botón para crear un nuevo chat -->
    <div class="d-grid">
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createChatModal">
        <i class="bi bi-plus-circle"></i> Crear Chat
      </button>
    </div>

  </div>

  <!-- JS para manejar la apertura del modal y cargar los mensajes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/chat.js"></script>

  <!-- Modal de chat -->
  <div class="modal fade" id="chatModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
                
        <div class="modal-header">

          <h5 
            class="modal-title" id="chatModalLabel"></h5>
          
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          
          <!-- Aquí se cargarán los mensajes del chat -->
          <div id="chatMessages" class="mb-3" style="max-height: 400px; overflow-y: auto;">
            <!-- Mensajes del chat -->
          </div>

          <!-- Formulario para enviar un nuevo mensaje -->
          <form id="messageForm">
            <div class="input-group">
              <input type="text" id="messageInput" class="form-control" placeholder="Escribe tu mensaje..." required>
              <button type="submit" class="btn btn-primary">Enviar</button>
            </div>
          </form>
        
        </div>

      </div>
    </div>
  </div>

  <!-- Modal para crear un nuevo chat -->
  <div class="modal fade" id="createChatModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Crear Chat</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <!-- Formulario para crear un nuevo chat -->
          <div id="participantsList">
              <div class="participant-row d-flex mb-2">
                  <input type="text" class="form-control me-2 participant-name" placeholder="Nombre">
                  <input type="text" class="form-control participant-lastname" placeholder="Apellido">
              </div>
          </div>

          <button type="button" class="btn btn-secondary mb-2" onclick="addParticipant()">
              + Añadir participante
          </button>

          <input type="text" class="form-control mb-2" id="chatName" placeholder="Nombre del chat">

          <button type="button" class="btn btn-primary" onclick="createChat()">
              Crear chat
          </button>
        </div>
      
      </div>
    </div>
  </div>
</body>
</html>
