<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow" style="width: 400px">
        <h4 class="mb-4 text-center">Crear cuenta</h4>
        <div id="registerError" class="alert alert-danger d-none"></div>
        
        <input type="text" id="name" class="form-control mb-3" placeholder="Nombre">
        
        <input type="text" id="lastname" class="form-control mb-3" placeholder="Apellido">
        
        <input type="password" id="password" class="form-control mb-3" placeholder="Contraseña (mín. 3 caracteres)">
        
        <select id="postcode" class="form-select mb-3">
            <option value="">Selecciona código postal</option>
            <option th:each="cp : ${#numbers.sequence(28001,28055)}"
                    th:value="${cp}" th:text="${cp}"></option>
        </select>

        <h6 class="mb-3">Selecciona tus categorías de interés:</h6>
        <div id="categoriesContainer" class="d-flex flex-wrap gap-2 mb-4">            
        </div>
        
        <button class="btn btn-primary w-100" onclick="register()">Registrarse</button>
        <p class="text-center mt-3">¿Ya tienes cuenta? <a th:href="@{/auth/login}">Inicia sesión</a></p>
    </div>
    <script>
        async function register() {
            const name = document.getElementById("name").value.trim();
            const lastname = document.getElementById("lastname").value.trim();
            const password = document.getElementById("password").value.trim();
            const postcode = document.getElementById("postcode").value.trim();
            const errorDiv = document.getElementById("registerError");

            // Validar campos obligatorios
            if (!name) {
                errorDiv.classList.remove("d-none");
                errorDiv.textContent = "Se requiere Nombre";
                return;
            }

            if (!lastname) {
                errorDiv.classList.remove("d-none");
                errorDiv.textContent = "Se requiere Apellido";
                return;
            }

            if (password.length < 3) {
                errorDiv.classList.remove("d-none");
                errorDiv.textContent = "La contraseña debe tener al menos 3 caracteres";
                return;
            }

            if (!postcode) {
                errorDiv.classList.remove("d-none");
                errorDiv.textContent = "Se requiere código postal";
                return;
            }

            const res = await fetch("/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: name,
                    lastname: lastname,
                    password: password,
                    postcode: postcode,
                    categoryNames: Array.from(selectedCategories)
                })
            });

            if (res.ok) {
                window.location.href = "/auth/login";
            } else {
                errorDiv.classList.remove("d-none");
                errorDiv.textContent = "Nombre y Apellido ya registrados";
            }
        }

        const selectedCategories = new Set();

        async function loadCategories() {
            const res = await fetch("/api/categories");
            const categories = await res.json();
            const container = document.getElementById("categoriesContainer");
            
            categories.forEach(category => {
                const card = document.createElement("div");
                card.className="category-card";                 
                card.textContent = category.name;
                card.dataset.id = category.id;

                card.addEventListener("click", () => {
                    if (selectedCategories.has(category.name)) {
                        selectedCategories.delete(category.name);
                        card.classList.remove("selected");
                    } else {
                        selectedCategories.add(category.name);
                        card.classList.add("selected");
                    }
                });

                container.appendChild(card);
            });
        }

        loadCategories();
    </script>
</body>
</html>
